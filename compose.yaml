# The backend on a server: run `docker compose up -d` in this checkout (see docs/DEPLOY.md).
# Compose builds the image from the checkout itself; research runs on separate workers.
# HTTPS comes from the web server in front of it, which proxies to 127.0.0.1:7706.
name: cet

services:
  tracker:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      # the owner of this checkout (.env), so the reports it commits and its data stay theirs
      args:
        TRACKER_UID: ${TRACKER_UID:-1000}
        TRACKER_GID: ${TRACKER_GID:-1000}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env.backend
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /data/tracker.sqlite
      WORKSPACE_PATH: /data/jobs
      # this checkout: reports are committed here and pushed to origin, which it follows
      REPO_PATH: /repo
      REPO_SYNC: "true"
      RESEARCH_MODE: remote
      TRUSTED_PROXY_CIDRS: 172.30.40.0/24
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    volumes:
      - .:/repo
      - ./backend/data:/data
      # the owner's SSH config, deploy key and known_hosts, for pushing
      - ${SSH_DIR:-${HOME}/.ssh}:/home/tracker/.ssh:ro
    # for the web server in front of it (tracker-api.cannabisfreedom.fyi → 127.0.0.1:7706)
    ports:
      - "127.0.0.1:7706:8080"
    networks: [tracker]

networks:
  tracker:
    ipam:
      config:
        - subnet: 172.30.40.0/24
