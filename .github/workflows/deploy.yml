name: Deploy to GitHub Pages

on:
  schedule:
    # Every 30 minutes, away from the busy start of the hour.
    - cron: '13,43 * * * *'
  workflow_dispatch:

# Let the workflow publish to Pages using GitHub's own token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for commits since the last successful deployment
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual run can redeploy the same commit, including after a configuration change.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Successful no-change runs have the same SHA as the preceding deployment.
          # Failed/cancelled builds and deployments never advance this checkpoint.
          deployed_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [[ "$GITHUB_SHA" == "$deployed_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits; skipping tests, build and deployment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The changelog is generated from the full commit history.
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Astro 7.4 needs Node 22.23.4 or newer; "22" resolved to an older 22.x on GitHub
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # npm run build runs the tests first (sources, citations, folders, country ids); a failure
      # stops deployment. The site URL and sub-path come from the repository's Pages settings, so
      # the same build works for user.github.io/repo and for tracker.cannabisfreedom.fyi.
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # the submissions backend (docs/DEPLOY.md); unset leaves the submission form off
          PUBLIC_SUBMISSIONS_API_URL: ${{ vars.PUBLIC_SUBMISSIONS_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
