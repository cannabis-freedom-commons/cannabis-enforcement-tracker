name: Deploy to GitHub Pages

on:
  # every push to main: the backend's publication batches (backend/internal/worker/batch.go) and
  # people's commits; changes that cannot change the site wait for the next build
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'deploy/**', 'compose.yaml', '.github/workflows/backend.yml']
  # Run workflow: build and deploy main now, also after a configuration change
  workflow_dispatch:

# Let the workflow publish to Pages using GitHub's own token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running one finishes, and of the pushes that come meanwhile only the
# newest waits, so a burst of pushes builds at most twice.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The changelog is generated from the full commit history.
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Astro 7.4 needs Node 22.23.4 or newer; "22" resolved to an older 22.x on GitHub
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # npm run build runs the tests first (sources, citations, folders, country ids); a failure
      # stops deployment. The site URL and sub-path come from the repository's Pages settings, so
      # the same build works for user.github.io/repo and for tracker.cannabisfreedom.fyi.
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # the submissions backend (docs/DEPLOY.md); unset leaves the submission form off
          PUBLIC_SUBMISSIONS_API_URL: ${{ vars.PUBLIC_SUBMISSIONS_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages-new
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
